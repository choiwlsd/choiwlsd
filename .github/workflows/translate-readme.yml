name: Sync bilingual README

on:
  push:
    branches: [main]
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-translation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Translate README
        uses: choiwlsd/readme-translate-kr-en@v0.2.4
        with:
          source-file: README.md

      - name: Commit translated README
        shell: bash
        run: |
          README_FILES=(README.md)

          for file in README.*.md; do
            [ -f "$file" ] && README_FILES+=("$file")
          done

          if [ -z "$(git status --porcelain -- "${README_FILES[@]}")" ]; then
            echo "No README changes."
            exit 0
          fi

          base_sha="$(git rev-parse HEAD)"
          branch="${GITHUB_REF_NAME}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- "${README_FILES[@]}"
          git commit -m "docs: sync bilingual README"

          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"

          if [ "$remote_sha" != "$base_sha" ]; then
            if ! git diff --quiet "$base_sha" "$remote_sha" -- \
              "${README_FILES[@]}"; then
              echo "README changed while translation was running."
              echo "Skipping stale translation; the newer run will handle it."
              exit 0
            fi

            git rebase "origin/$branch"
          fi

          git push origin "HEAD:$branch"
